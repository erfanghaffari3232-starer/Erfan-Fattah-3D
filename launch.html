<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07111b">
<title>Erfan | صحنه پرتاب نمایشی</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Tahoma,Arial,sans-serif;background:#06111d;color:#eef7fb}body{overflow:hidden}.scene{height:100svh;min-height:560px;position:relative;overflow:hidden;background:linear-gradient(180deg,#071426 0%,#102b43 55%,#d07848 100%)}.stars{position:absolute;inset:0;background-image:radial-gradient(2px 2px at 12% 18%,#fff 60%,transparent),radial-gradient(1px 1px at 28% 33%,#fff 60%,transparent),radial-gradient(2px 2px at 76% 17%,#fff 60%,transparent),radial-gradient(1px 1px at 88% 39%,#fff 60%,transparent),radial-gradient(1px 1px at 56% 11%,#fff 60%,transparent),radial-gradient(2px 2px at 42% 26%,#fff 60%,transparent);opacity:.8}.moon{position:absolute;top:9%;left:12%;width:74px;height:74px;border-radius:50%;background:#d8e8ee;box-shadow:0 0 45px #d8e8ee66}.hills{position:absolute;bottom:0;left:-5%;width:110%;height:28%;background:#111f29;clip-path:polygon(0 65%,12% 43%,23% 70%,37% 20%,51% 65%,66% 31%,78% 69%,91% 39%,100% 68%,100% 100%,0 100%)}.ground{position:absolute;bottom:0;height:12%;width:100%;background:linear-gradient(#24313a,#111a20)}.pad{position:absolute;bottom:11%;left:50%;transform:translateX(-50%);width:190px;height:14px;border-radius:50%;background:#70818a;box-shadow:0 0 25px #f6a15b66}.craft-wrap{position:absolute;left:50%;bottom:calc(11% + 12px);transform:translateX(-50%);width:90px;height:300px;display:flex;justify-content:center;align-items:flex-end;transition:bottom 5.2s cubic-bezier(.16,.72,.28,1)}.craft{position:relative;width:52px;height:235px;border-radius:48% 48% 15% 15%/18% 18% 8% 8%;background:linear-gradient(90deg,#4d626c,#dce6e8 28%,#8d9fa6 65%,#3d505b);box-shadow:inset -7px 0 10px #17252c,0 0 22px #b5d8e333}.nose{position:absolute;top:-56px;left:0;width:0;height:0;border-left:26px solid transparent;border-right:26px solid transparent;border-bottom:58px solid #d9e3e5;filter:drop-shadow(0 2px 2px #24333c)}.band{position:absolute;top:72px;left:0;width:100%;height:12px;background:#2e9d82;border-block:2px solid #183c3b}.window{position:absolute;top:37px;left:17px;width:18px;height:18px;border-radius:50%;background:#183e54;border:3px solid #dce8eb;box-shadow:0 0 9px #7bd6ec}.fin{position:absolute;bottom:4px;width:28px;height:70px;background:linear-gradient(90deg,#263d49,#82939a);clip-path:polygon(100% 0,100% 100%,0 100%,28% 25%)}.fin.left{left:-20px}.fin.right{right:-20px;transform:scaleX(-1)}.flame{position:absolute;bottom:-94px;left:14px;width:24px;height:105px;opacity:0;background:linear-gradient(#fff8b4,#ffb33c 35%,#f15c27 72%,transparent);filter:blur(3px);clip-path:polygon(20% 0,80% 0,100% 45%,50% 100%,0 45%)}.craft-wrap.go{bottom:115%}.craft-wrap.go .flame{opacity:1;animation:flame .12s infinite alternate}.smoke{position:absolute;bottom:10%;left:50%;width:20px;height:20px;transform:translateX(-50%);pointer-events:none}.puff{position:absolute;width:36px;height:36px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#eef3f3,#899ba2 70%,#53646d);filter:blur(2px);opacity:0;animation:smoke 3.5s ease-out forwards}.puff:nth-child(2n){width:55px;height:55px;animation-delay:.18s}.puff:nth-child(3n){width:44px;height:44px;animation-delay:.38s}@keyframes flame{from{transform:scaleY(.85)}to{transform:scaleY(1.12)}}@keyframes smoke{0%{opacity:0;transform:translate(-50%,0) scale(.3)}18%{opacity:.65}100%{opacity:0;transform:translate(calc(-50% + var(--x)), -210px) scale(2.6)}}.hud{position:absolute;top:22px;right:22px;left:22px;display:flex;justify-content:space-between;align-items:flex-start;gap:15px}.brand{font-weight:bold;font-size:clamp(18px,3vw,28px)}.brand span{color:#5ce0b5}.pill{font-size:11px;color:#a8c3d0;border:1px solid #63809366;padding:8px 12px;border-radius:30px}.panel{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);width:min(560px,calc(100% - 30px));padding:18px;background:#081725d9;border:1px solid #53708366;border-radius:18px;text-align:center;backdrop-filter:blur(10px)}h1{font-size:19px;margin:0 0 8px}.desc{font-size:12px;line-height:1.9;color:#b2c6d0;margin:0 0 13px}.actions{display:flex;justify-content:center;gap:9px;flex-wrap:wrap}button,a{font:inherit;text-decoration:none;border:1px solid #527184;background:#183348;color:#f2f8fa;padding:11px 17px;border-radius:11px;cursor:pointer}button.primary{background:#247b68;border-color:#55d6b0}button:hover,a:hover{filter:brightness(1.2)}.status{font-size:11px;color:#6fe0b8;margin-top:12px;min-height:16px}.back{position:absolute;top:75px;right:22px;font-size:12px;padding:8px 12px}@media(max-height:650px){.craft-wrap{transform:translateX(-50%) scale(.78);transform-origin:bottom center}.panel{bottom:10px;padding:12px}.hud{top:12px}.back{top:60px}}
</style>
</head>
<body>
<div class="scene"><div class="stars"></div><div class="moon"></div><div class="hills"></div><div class="ground"></div><div class="pad"></div>
<div class="craft-wrap" id="craft"><div class="craft"><div class="nose"></div><div class="window"></div><div class="band"></div><div class="fin left"></div><div class="fin right"></div><div class="flame"></div></div></div><div class="smoke" id="smoke"></div>
<div class="hud"><div class="brand"><span>ERFAN</span> · 3D EXHIBITION</div><div class="pill">انیمیشن مستقل · بدون تصویر خارجی</div></div>
<a class="back" href="index.html">بازگشت به نمایشگاه</a>
<section class="panel"><h1>صحنه پرتاب نمایشی</h1><p class="desc">یک انیمیشن گرافیکی مستقل و خیالی؛ بدنه و دود با CSS ساخته شده‌اند و به عکس، ویدیو یا کتابخانه خارجی نیاز ندارند.</p><div class="actions"><button class="primary" id="start">شروع پرتاب نمایشی</button><button id="again">اجرای دوباره</button><a href="index.html">صفحه مدل سه‌بعدی</a></div><div class="status" id="status">برای شروع، دکمه را بزن.</div></section>
</div>
<script>
const craft=document.getElementById('craft'),smoke=document.getElementById('smoke'),status=document.getElementById('status');let running=false;
function launch(){if(running)return;running=true;craft.classList.remove('go');void craft.offsetWidth;smoke.innerHTML='';craft.classList.add('go');status.textContent='نمایش پرتاب در حال اجراست…';for(let i=0;i<18;i++){const p=document.createElement('i');p.className='puff';p.style.setProperty('--x',(Math.random()*190-95)+'px');p.style.left=(Math.random()*50-25)+'px';p.style.animationDelay=(Math.random()*.7)+'s';smoke.appendChild(p)}setTimeout(()=>{craft.classList.remove('go');status.textContent='نمایش به پایان رسید؛ برای تکرار دوباره دکمه را بزن.';running=false},5400)}
document.getElementById('start').addEventListener('click',launch);document.getElementById('again').addEventListener('click',()=>{running=false;launch()});
</script>
</body></html>
